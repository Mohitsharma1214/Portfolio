<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting — Mohit Sharma | AI Engineer</title>
    <meta name="robots" content="noindex, follow" />
    <script>
      // Single Page Application routing redirect for GitHub Pages root user repositories
      // MIT License: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var basePath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var subPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        basePath + '/?/' + subPath +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 40px; text-align: center; color: #1e293b; background-color: #f8fafc;">
    <h2>Redirecting to Mohit Sharma's Portfolio...</h2>
    <p style="color: #64748b; margin-top: 12px;">If you are not redirected automatically, <a href="/" style="color: #2563eb; text-decoration: underline;">click here to enter</a>.</p>
  </body>
</html>
