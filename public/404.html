<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting — Mohit Sharma | AI Engineer</title>
    <meta name="robots" content="noindex, follow" />
    <script>
      // Single Page Application routing redirect for GitHub Pages project repositories
      // Repository path: /Portfolio/ -> pathSegmentsToKeep = 1
      (function() {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        var pathname = l.pathname;
        var segments = pathname.replace(/^\/+|\/+$/g, '').split('/');
        
        // Extract the sub-path after /Portfolio/
        var routePath = segments.slice(pathSegmentsToKeep).join('/');
        var basePath = '/' + segments.slice(0, pathSegmentsToKeep).join('/');
        
        var destination = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + basePath + '/';
        if (routePath.length > 0) {
          destination += '#/' + routePath;
        }
        if (l.search) {
          destination += l.search;
        }
        if (l.hash) {
          destination += l.hash;
        }
        l.replace(destination);
      })();
    </script>
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 40px; text-align: center; color: #1e293b; background-color: #f8fafc;">
    <h2>Redirecting to Mohit Sharma's Portfolio...</h2>
    <p style="color: #64748b; margin-top: 12px;">If you are not redirected automatically, <a href="/Portfolio/" style="color: #2563eb; text-decoration: underline;">click here to enter</a>.</p>
  </body>
</html>
